[project]
name = "cube-faces-detection"
version = "0.0.0"
description = "Estudo experimental de detecção das faces de um cubo mágico com OpenCV."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.4",
    "opencv-python==4.13.0.92",
    "rubik-cube==0.0.2",
    "RubikOptimal==1.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest",
    "pytest-cov",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "scripts/*"]
branch = true

[tool.coverage.report]
fail_under = 68
show_missing = false
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
# E/W/F: pycodestyle e pyflakes; B: bugbear; S: regras do bandit (segurança);
# UP: sintaxe moderna; I: ordem dos imports.
select = ["E", "F", "W", "B", "S", "UP", "I"]
# E501: o formatter cuida do comprimento; sobram strings e comentários longos.
# B905: zip(strict=) mudaria o comportamento de comparações de tamanho diferente.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
